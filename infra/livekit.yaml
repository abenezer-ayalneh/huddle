# LiveKit server config (local development).
# Docs: https://docs.livekit.io
#
# IMPORTANT: the key/secret here must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET
# in your .env (the backend signs tokens with the same pair).
# For production, generate a strong secret and do NOT commit it.

port: 7880                 # HTTP / WebSocket signaling + API (TCP)

rtc:
  tcp_port: 7881           # WebRTC over TCP (fallback)
  port_range_start: 50000  # WebRTC media (UDP) start
  port_range_end: 60000    # WebRTC media (UDP) end
  # On a server with a public IP behind NAT, set this so clients get the right
  # address. Leave commented for local dev.
  # use_external_ip: true

# API keys: "key: secret". Keep in sync with .env.
keys:
  devkey: replace-with-a-long-random-secret

# Redis is required for multi-node and recommended generally.
redis:
  address: localhost:6379

# Built-in TURN — helps clients behind restrictive NATs.
# For local-only testing you can leave this disabled. Enable + add TLS for prod.
turn:
  enabled: false
  # udp_port: 3478
  # tls_port: 5349
  # domain: your-domain

logging:
  level: info
