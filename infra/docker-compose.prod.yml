# Production override (Phase 9 — single-VPS deploy). Layer it on top of the dev
# compose:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
#     --env-file .env.prod up -d --build
#
# It adds containerized web/api, switches LiveKit to the prod config (external
# IP, embedded TURN/TLS, metrics), and sets restart:always. TLS termination and
# signal/WSS reverse proxying are handled by a HOST-installed Caddy (see
# infra/huddle.caddy), not a container — the web/api containers publish their
# ports on localhost for it to reach. Internal stores (postgres/redis/minio)
# keep the localhost-only port bindings from the base file — they're reached
# over the Docker network here. See docs/adr/0004 and docs/SETUP.md.

services:
  # --- Frontend (Next.js standalone) ---
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* are baked at build time (they ship to the browser).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
    restart: always
    environment:
      NODE_ENV: production
      # Container-internal listen port (NOT the published host port). Next reads
      # PORT; the ports mapping below uses the same value so they can't drift.
      PORT: '${WEB_PORT:-3000}'
      HOSTNAME: '0.0.0.0' # Next standalone must bind all interfaces (not just localhost)
    # Published on localhost so the HOST-installed Caddy can reach it. Never
    # bound to a public iface.
    # ${WEB_HOST_PORT} is the host port Caddy proxies to (default 3001); the
    # container side is the app's internal ${WEB_PORT} (default 3000).
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3001}:${WEB_PORT:-3000}'
    depends_on:
      - api

  # --- API (NestJS) ---
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: always
    # The API reads all its config from the environment in prod (no repo-root
    # .env file inside the container). env_file is resolved relative to this
    # compose file (infra/), so point at the repo-root .env.prod.
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production
      LOG_FORMAT: json # structured JSON logs in prod (logging/json.logger.ts)
    # Published on localhost for a host-installed reverse proxy (see `web` above).
    # ${API_HOST_PORT} is the host port Caddy proxies to (default 3002); the
    # container side is the app's internal ${API_PORT} (default 3001) — the same
    # API_PORT the NestJS app binds (from .env.prod), so the two stay in sync.
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3002}:${API_PORT:-3001}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  # --- LiveKit: prod config (external IP, TURN/TLS, metrics) ---
  livekit:
    restart: always
    # node-ip is omitted so LiveKit auto-detects the public IP (use_external_ip
    # in the prod config). Pin it with --node-ip ${LIVEKIT_NODE_IP} if needed.
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
      - ./turn-certs:/etc/livekit/turn:ro # provision cert.pem/key.pem here
    ports:
      - '3478:3478/udp' # TURN/UDP
      - '5349:5349' # TURN/TLS

  egress:
    restart: always

  postgres:
    restart: always

  redis:
    restart: always

  minio:
    restart: always
