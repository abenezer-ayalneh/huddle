# Self-hosted LiveKit + Redis for local development.
# Start:  docker compose -f infra/docker-compose.yml up -d   (or: pnpm infra:up)
# Stop:   docker compose -f infra/docker-compose.yml down     (or: pnpm infra:down)
#
# Networking: this file uses explicit port mapping (not host networking) so it
# works on macOS/Windows Docker Desktop, where `network_mode: host` does NOT
# forward the WebRTC UDP media range. The UDP range is deliberately narrowed
# (50000-50200) so Docker Desktop starts quickly; it must match
# rtc.port_range_start/end in livekit.yaml.
#
# Reads LIVEKIT_KEYS from the repo-root .env (single source of truth for the
# API key/secret — see docs/adr/0001-livekit-secret-single-source.md).
#
# LIVEKIT_NODE_IP: the IP LiveKit advertises to browsers for WebRTC media.
# Inside Docker's bridge network the server would otherwise advertise its
# unreachable container IP (172.x), and ICE fails with "could not establish pc
# connection". Set it in .env to your host's LAN IP (works for same-machine AND
# other devices on the LAN). See docs/SETUP.md.

services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP}
    environment:
      # LiveKit reads its API keys from this env var ("key: secret").
      # Interpolated from the repo-root .env (single source of truth); no
      # credentials live in livekit.yaml. Run compose from the repo root so
      # the .env is picked up (the pnpm infra:* scripts do this).
      LIVEKIT_KEYS: ${LIVEKIT_KEYS}
    ports:
      - '7880:7880' # signaling / API (TCP)
      - '7881:7881' # WebRTC over TCP (fallback)
      - '50000-50200:50000-50200/udp' # WebRTC media (RTP/RTCP)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Bound to localhost: dev tools on the host still reach it, but it's never
    # published on a public interface. Containers (api, livekit, egress) reach it
    # by service name over the Docker network regardless of this mapping.
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --save 60 1 --loglevel warning

  # LiveKit Egress records the composited room (Phase 8). It connects to the
  # same Redis as livekit-server to receive jobs, joins the room as a headless
  # Chrome client, and uploads the finished MP4 to MinIO (S3). The S3 upload
  # target (bucket/endpoint/creds) is passed per-request by the API, so it lives
  # in the API's env, not here. CAP_SYS_ADMIN is required for the bundled
  # headless Chrome sandbox.
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    # Egress runs a headless Chrome compositor; the default 64MB /dev/shm is too
    # small and Chrome crashes on launch ("chrome failed to start"). LiveKit's
    # egress docs require a larger shm.
    shm_size: '1gb'
    # Config is passed inline (not a committed file) so the API secret stays out
    # of source — docker-compose interpolates ${LIVEKIT_*} from the repo-root
    # .env, the same single-source pattern as LIVEKIT_KEYS. ws_url/redis use the
    # compose service names (egress runs inside the bridge network).
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
        ws_url: ws://livekit:7880
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        insecure: true
        log_level: info
    cap_add:
      - CAP_SYS_ADMIN
    # Guarantees host.docker.internal resolves inside the egress network namespace
    # (used by the egress-netfix sidecar below).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - redis
      - livekit

  # DEV-ONLY networking shim for Docker Desktop (macOS/Windows). LiveKit
  # advertises a single ICE candidate (LIVEKIT_NODE_IP = the host LAN IP) so LAN
  # browsers can reach media. But on Docker Desktop the egress *container* cannot
  # route to that LAN IP, so its WebRTC never connects and recordings abort with
  # "Start signal not received". This sidecar shares the egress network namespace
  # and installs a DNAT rule redirecting the LAN IP to host.docker.internal —
  # which DOES reach the host's published LiveKit ports — so egress media works.
  #
  # NOT needed in production: on a flat Linux host the egress reaches the node IP
  # directly, so this service is absent from docker-compose.prod.yml. See the
  # "in-call recording aborts" note in docs/SETUP.md.
  egress-netfix:
    image: alpine:latest
    restart: unless-stopped
    # Opt-in profile so this NEVER starts in prod. The prod stack is base + the
    # prod override with no profile active, so egress-netfix is excluded there
    # (on a flat Linux host the DNAT would be wrong/harmful). `pnpm infra:up`
    # activates the profile for local dev.
    profiles:
      - dev-egress-fix
    network_mode: 'service:egress'
    cap_add:
      - NET_ADMIN
    depends_on:
      - egress
    # Resolve the host gateway, then DNAT all traffic bound for the advertised
    # LAN IP to it. Runs in a loop re-asserting the rule (idempotent via -C) so a
    # transient egress restart that recreates the shared netns self-heals.
    command:
      - sh
      - -c
      - |
        apk add -q iptables bind-tools
        HOSTIP=$$(getent hosts host.docker.internal | awk '{print $$1}')
        echo "egress-netfix: ensuring DNAT ${LIVEKIT_NODE_IP} -> $$HOSTIP"
        while true; do
          iptables -t nat -C OUTPUT -d ${LIVEKIT_NODE_IP} -j DNAT --to-destination $$HOSTIP 2>/dev/null \
            || iptables -t nat -A OUTPUT -d ${LIVEKIT_NODE_IP} -j DNAT --to-destination $$HOSTIP
          sleep 5
        done

  # MinIO is an S3-compatible object store; recordings land here. It keeps the
  # app fully self-hosted/offline (no real AWS needed). Console on :9001, S3 API
  # on :9000. The API ensures the bucket exists before starting a recording.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-huddle}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-huddlehuddle}
    # Localhost-only: in dev the host-run API reads recordings via localhost:9000
    # and you can open the console on localhost:9001. In prod the API container
    # talks to minio:9000 over the Docker network, so this is never public.
    ports:
      - '127.0.0.1:9000:9000' # S3 API
      - '127.0.0.1:9001:9001' # web console
    volumes:
      - huddle-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 5

  # Postgres backs accounts + persistent scheduled rooms (Phase 7). The API
  # connects via DATABASE_URL in the repo-root .env. Credentials are interpolated
  # from .env so they stay in one place; the named volume persists data across
  # `infra:down`/`infra:up`.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huddle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huddle}
      POSTGRES_DB: ${POSTGRES_DB:-huddle}
    # Localhost-only (Prisma CLI on the host connects via localhost). The API
    # container reaches it as postgres:5432 over the Docker network in prod.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - huddle-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-huddle}']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  huddle-postgres:
  huddle-minio:
