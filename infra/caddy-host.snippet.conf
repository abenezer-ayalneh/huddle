# Huddle site blocks for your GLOBAL (host-installed) Caddy.
# Append these to your existing /etc/caddy/Caddyfile (which already has the
# portfolio block for abenezer-ayalneh.dev), then: sudo systemctl reload caddy
#
# These three are HTTP/WSS and Caddy auto-issues their TLS certs. The TURN
# hostname (huddle-turn.abenezer-ayalneh.dev) is NOT here — TURN is not an HTTP
# service; LiveKit terminates its own TLS for it (see runbook).

# Frontend (Next.js) -> web container published on 127.0.0.1:8080
huddle.abenezer-ayalneh.dev {
	reverse_proxy 127.0.0.1:8080
}

# API (NestJS: REST + BetterAuth + LiveKit webhook) -> api container on 127.0.0.1:8081
huddle-api.abenezer-ayalneh.dev {
	reverse_proxy 127.0.0.1:8081
}

# LiveKit signal / WSS -> livekit container on 127.0.0.1:7880.
# Caddy upgrades the WebSocket automatically; media + TURN bypass Caddy.
huddle-livekit.abenezer-ayalneh.dev {
	reverse_proxy 127.0.0.1:7880
}
