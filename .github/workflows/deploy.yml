name: Deploy

# Runs only after the CI workflow completes on main. Gated on CI success below.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

# Never let two deploys run at once; let an in-flight one finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Skip unless CI passed (workflow_dispatch has no workflow_run, so allow it too).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production # remove this line if you skipped Step 4
    env:
      WINDOWS_CONTROL_AGENT_RELEASE_CHANNEL_URL: https://github.com/abenezer-ayalneh/huddle/releases/download/windows-control-agent-beta
      WINDOWS_CONTROL_AGENT_RELEASES_URL: https://github.com/abenezer-ayalneh/huddle/releases/tag/windows-control-agent-beta
      WINDOWS_CONTROL_AGENT_ISSUES_URL: https://github.com/abenezer-ayalneh/huddle/issues
      WINDOWS_CONTROL_AGENT_UPDATE_PUBLIC_KEY: ${{ secrets.WINDOWS_AGENT_UPDATE_PUBLIC_KEY }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m # building both images on a small VPS is slow
          script_stop: true # abort on the first failing command
          envs: WINDOWS_CONTROL_AGENT_RELEASE_CHANNEL_URL,WINDOWS_CONTROL_AGENT_RELEASES_URL,WINDOWS_CONTROL_AGENT_ISSUES_URL,WINDOWS_CONTROL_AGENT_UPDATE_PUBLIC_KEY
          script: |
            set -e
            cd /home/huddle
            upsert_env() {
              key="$1"
              value="$(printenv "$key")"
              if [ -z "$value" ]; then
                echo "Missing required deploy value: $key" >&2
                exit 1
              fi
              temporary_env="$(mktemp .env.prod.XXXXXX)"
              awk -v key="$key" -v value="$value" '
                $0 ~ "^" key "=" { print key "=" value; found = 1; next }
                { print }
                END { if (!found) print key "=" value }
              ' .env.prod > "$temporary_env"
              mv "$temporary_env" .env.prod
            }
            upsert_env WINDOWS_CONTROL_AGENT_RELEASE_CHANNEL_URL
            upsert_env WINDOWS_CONTROL_AGENT_RELEASES_URL
            upsert_env WINDOWS_CONTROL_AGENT_ISSUES_URL
            upsert_env WINDOWS_CONTROL_AGENT_UPDATE_PUBLIC_KEY
            # Sync the tree FIRST so infra/deploy.sh (and any change to it) is on
            # disk before we invoke it — the script can't pull itself into existence.
            git fetch --prune origin
            git reset --hard origin/main
            bash infra/deploy.sh
