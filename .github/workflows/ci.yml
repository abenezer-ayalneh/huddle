# CI gate (Phase 9). Runs the same checks as the local pre-commit hook plus a
# full build, on every push and PR. Activates automatically once this repo has a
# GitHub remote (there is none today — see docs/adr/0004). Deploy (CD) is a
# manual runbook in docs/SETUP.md, not automated here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @huddle/api exec prisma generate

      - name: Prettier (check)
        run: pnpm exec prettier --check .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          # Next.js statically renders metadata and legal routes during this
          # step. These are public, non-production values solely for CI; the
          # production Docker build receives its real values from the VPS's
          # untracked .env.prod file.
          NEXT_PUBLIC_SITE_URL: https://ci.huddle.invalid
          NEXT_PUBLIC_API_URL: https://api.ci.huddle.invalid
          NEXT_PUBLIC_AUTH_URL: https://api.ci.huddle.invalid
          NEXT_PUBLIC_OPERATOR_NAME: Huddle CI
          NEXT_PUBLIC_OPERATOR_CONTACT_URL: https://ci.huddle.invalid/contact
          NEXT_PUBLIC_PROJECT_REPOSITORY_URL: https://example.invalid/huddle
        run: pnpm build
