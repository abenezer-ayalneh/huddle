<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huddle — Present with Control</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f1117;
        color: #e4e4e7;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 24px;
        user-select: none;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .subtitle {
        font-size: 13px;
        color: #a1a1aa;
        margin-bottom: 24px;
        text-align: center;
      }
      .field {
        width: 100%;
        max-width: 360px;
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #a1a1aa;
        margin-bottom: 6px;
      }
      select,
      .info-box {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        background: #1c1e26;
        border: 1px solid #27272a;
        color: #e4e4e7;
        font-size: 14px;
        outline: none;
      }
      select:focus {
        border-color: #22d3ee;
      }
      .info-box {
        font-size: 13px;
      }
      .info-box .room {
        color: #22d3ee;
        font-weight: 600;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
      }
      button {
        padding: 10px 24px;
        border-radius: 8px;
        border: none;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-cancel {
        background: #27272a;
        color: #a1a1aa;
      }
      .btn-cancel:hover {
        background: #3f3f46;
      }
      .btn-confirm {
        background: #0891b2;
        color: #fff;
      }
      .btn-confirm:hover {
        background: #06b6d4;
      }
      .btn-confirm:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        font-size: 13px;
        color: #a1a1aa;
        margin-top: 16px;
      }
      .status.error {
        color: #f87171;
      }
      .status.active {
        color: #34d399;
      }
      #setup,
      #sharing {
        display: none;
      }
      #sharing {
        text-align: center;
      }
      .sharing-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #34d399;
        display: inline-block;
        margin-right: 6px;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="setup">
      <h1>Present with Control</h1>
      <p class="subtitle">Share your screen and let a participant control your machine</p>

      <div class="field">
        <label>Room</label>
        <div class="info-box"><span class="room" id="room-name">—</span></div>
      </div>

      <div class="field">
        <label>Monitor to share</label>
        <select id="monitor-select"></select>
      </div>

      <div class="actions">
        <button class="btn-cancel" id="btn-cancel">Cancel</button>
        <button class="btn-confirm" id="btn-confirm" disabled>Start sharing</button>
      </div>

      <p class="status" id="status"></p>
    </div>

    <div id="sharing">
      <p><span class="sharing-indicator"></span> Sharing your screen</p>
      <p class="subtitle" id="sharing-room"></p>
      <button class="btn-cancel" id="btn-stop" style="margin-top: 16px">Stop sharing</button>
    </div>

    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;

      const setupEl = document.getElementById("setup");
      const sharingEl = document.getElementById("sharing");
      const monitorSelect = document.getElementById("monitor-select");
      const statusEl = document.getElementById("status");
      const confirmBtn = document.getElementById("btn-confirm");
      const roomNameEl = document.getElementById("room-name");
      const sharingRoomEl = document.getElementById("sharing-room");

      function setStatus(msg, cls) {
        statusEl.textContent = msg;
        statusEl.className = "status " + (cls || "");
      }

      async function init() {
        setupEl.style.display = "block";

        // Populate monitors
        try {
          const monitors = await invoke("list_monitors");
          monitorSelect.innerHTML = "";
          for (const m of monitors) {
            const opt = document.createElement("option");
            opt.value = m.id;
            opt.textContent = `${m.name} (${m.width}×${m.height})${m.is_primary ? " — Primary" : ""}`;
            monitorSelect.appendChild(opt);
          }
          confirmBtn.disabled = monitors.length === 0;
        } catch (e) {
          setStatus("Failed to list monitors: " + e, "error");
        }

        // Show room info if we have it
        try {
          const info = await invoke("get_session_info");
          if (info) {
            roomNameEl.textContent = info.room;
          }
        } catch {}
      }

      confirmBtn.addEventListener("click", async () => {
        confirmBtn.disabled = true;
        setStatus("Connecting…");
        try {
          await invoke("start_sharing", { monitorId: parseInt(monitorSelect.value, 10) });
        } catch (e) {
          setStatus("Failed: " + e, "error");
          confirmBtn.disabled = false;
        }
      });

      document.getElementById("btn-cancel").addEventListener("click", async () => {
        await invoke("cancel_session");
      });

      document.getElementById("btn-stop").addEventListener("click", async () => {
        await invoke("stop_sharing");
      });

      // Backend events
      listen("session-ready", (e) => {
        roomNameEl.textContent = e.payload.room;
        confirmBtn.disabled = false;
        setStatus("");
      });

      listen("sharing-started", (e) => {
        setupEl.style.display = "none";
        sharingEl.style.display = "block";
        sharingRoomEl.textContent = "Room: " + (e.payload.room || "");
      });

      listen("sharing-stopped", () => {
        sharingEl.style.display = "none";
        setupEl.style.display = "block";
        confirmBtn.disabled = false;
        setStatus("Sharing ended", "");
      });

      listen("session-error", (e) => {
        setStatus(e.payload.message || "Unknown error", "error");
        confirmBtn.disabled = false;
      });

      init();
    </script>
  </body>
</html>
